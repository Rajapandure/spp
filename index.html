<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Scholars Point" />
  <meta name="description" content="Scholars Point — Offline-First Digital Learning Platform for Classes 1 to 10 (NCERT, CBSE, MP Board)" />
  <title>Scholars Point | Classes 1–10 Offline Learning Platform</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./src/styles/design-system.css" />
  <style>
    @media (max-width: 820px) {
      .sp-workspace-grid { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <div id="sp-toast" style="display:none;position:fixed;top:16px;right:16px;z-index:999;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:0.86rem;box-shadow:0 8px 24px rgba(0,0,0,0.2);"></div>

  <div id="sp-app">
    <div style="padding:48px;text-align:center;font-family:system-ui,sans-serif;color:#475569;">Loading Scholars Point Offline Platform...</div>
  </div>

  <!-- Floating Rough Slate Modal -->
  <div id="sp-slate-modal" class="sp-modal-backdrop no-print" style="display:none;">
    <div class="sp-modal" style="max-width:540px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong>✏️ Interactive Rough Slate</strong>
        <div style="display:flex;gap:8px;">
          <button class="sp-btn sp-btn-secondary" style="min-height:32px;font-size:12px;" onclick="window.SP.clearRoughSlate()">Clear</button>
          <button class="sp-btn sp-btn-secondary" style="min-height:32px;font-size:12px;" onclick="window.SP.closeRoughSlate()">Close</button>
        </div>
      </div>
      <canvas id="sp-slate-canvas" width="480" height="280" style="width:100%;height:280px;background:#fffbeb;border:2px dashed #fbbf24;border-radius:14px;touch-action:none;cursor:crosshair;"></canvas>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
